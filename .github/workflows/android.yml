# Builds the Charmera Card app and publishes it as the release "android-app", so the phone download link stays the
# same: https://github.com/<owner>/charmera-toolkit/releases/download/android-app/charmera-card.apk
# Runs on every push to main that touches android/, and from the Actions tab ("Run workflow").
# Signing: every published APK is signed with the release key held in the repo secrets SIGNING_KEYSTORE_B64,
# SIGNING_ALIAS and SIGNING_PASS, so each new version installs over the old one. Before publishing, the workflow
# checks that the APK's certificate matches android/SIGNING_CERT_SHA256 and refuses otherwise. Without the secrets
# the APK is built with a throwaway key and kept only as a run artifact; it never replaces the published one.
name: android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
# One run at a time, so two publishes never race on the release. A run that starts while another is going waits
# for it instead of cancelling it, so a publish is never cut off half way.
concurrency:
  group: android-app-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools   # the default also asks for the retired "tools" package, which is no longer served
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Public stock dump for the tests (downloaded from upstream, never stored)
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/stock.bin" \
            "https://raw.githubusercontent.com/benbadio/keychain-camera-plus/209c25a47ce91c805b663edb6e18861b367a5a1b/dumps/charmera_stock_latest.bin"
          echo "cc3b4b2fd7eb71ba5a441decdc86984261fac8418ee3e105d7e2b3c38b7ea42f  $RUNNER_TEMP/stock.bin" | sha256sum -c -
          echo "CHARMERA_STOCK_IMAGE=$RUNNER_TEMP/stock.bin" >> "$GITHUB_ENV"
      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/signing.keystore
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEYSTORE_B64 secret: built with a throwaway key and NOT published, since it could not install over the released app. It is kept as a run artifact."
          fi
      - name: Build (runs the checker tests first)
        env:
          KS_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          KS_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          cd android
          VER=$(cat VERSION)
          if [ -f signing.keystore ]; then export KEYSTORE=signing.keystore; else unset KS_ALIAS KS_PASS; fi
          SDK=$ANDROID_HOME ./build.sh "$VER" "${{ github.run_number }}"
          cp "out/charmera-card-$VER.apk" out/charmera-card.apk
      - name: Check the signing certificate
        if: steps.key.outputs.release == 'true'
        run: |
          want=$(tr -d ' \n' < android/SIGNING_CERT_SHA256)
          got=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/out/charmera-card.apk \
                | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "certificate SHA-256: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::The APK is signed by certificate $got, not the release key $want. Not publishing: it would not install over the released app."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: charmera-card
          path: android/out/charmera-card.apk
      - name: Publish on Releases
        if: github.ref == 'refs/heads/main' && steps.key.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is never deleted: the tag moves to this commit and the APK is replaced in place, so the
          # download link keeps working even if GitHub fails part way. Server errors are retried.
          VER=$(cat android/VERSION)
          TITLE="Charmera Card for Android $VER (build ${{ github.run_number }})"
          NOTES="Puts a verified Charmera update file on an SD card from an Android phone (7.0 or later). It writes nothing without a dump of that camera's own flash chip, and compares the update file with it. Download charmera-card.apk on the phone, open it, and allow the install. What it does and what it cannot do: android/README.md."
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i * 15)); done; return 1; }
          # Each step can be repeated safely, so a server error never leaves a half-made release behind:
          # create the release only if it is missing (gh also finds a draft by its tag), replace the APK,
          # then make sure it is published (not a draft) with this build's title.
          ensure_release() { gh release view android-app >/dev/null 2>&1 || gh release create android-app --verify-tag --title "$TITLE" --notes "$NOTES"; }
          git tag -f android-app "$GITHUB_SHA"
          retry git push -f origin refs/tags/android-app
          retry ensure_release
          retry gh release upload android-app android/out/charmera-card.apk --clobber
          retry gh release edit android-app --draft=false --title "$TITLE" --notes "$NOTES"
          # Fail unless the published release, looked up the way the download link is, carries the APK.
          check() { gh api "repos/${{ github.repository }}/releases/tags/android-app" --jq '.assets[].name' | grep -qx charmera-card.apk; }
          retry check
          echo "APK: https://github.com/${{ github.repository }}/releases/download/android-app/charmera-card.apk" >> "$GITHUB_STEP_SUMMARY"
