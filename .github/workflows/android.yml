# Builds the Charmera Card app and publishes it as the release "android-app", so the phone download link stays the
# same: https://github.com/<owner>/charmera-toolkit/releases/download/android-app/charmera-card.apk
# Runs on every push to main that touches android/, and from the Actions tab ("Run workflow").
# Signing: set the repo secrets SIGNING_KEYSTORE_B64, SIGNING_ALIAS and SIGNING_PASS to sign every build with the
# same key, so a new version installs over the old one. Without them each build gets a throwaway key and the old
# app must be uninstalled before the new one is installed.
name: android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools   # the default also asks for the retired "tools" package, which is no longer served
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/signing.keystore
          else echo "::warning::No SIGNING_KEYSTORE_B64 secret: signing with a throwaway key, so this APK cannot be installed over an earlier one."; fi
      - name: Build (runs the checker tests first)
        env:
          KS_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          KS_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          cd android
          VER=$(cat VERSION)
          if [ -f signing.keystore ]; then export KEYSTORE=signing.keystore; else unset KS_ALIAS KS_PASS; fi
          SDK=$ANDROID_HOME ./build.sh "$VER" "${{ github.run_number }}"
          cp "out/charmera-card-$VER.apk" out/charmera-card.apk
      - uses: actions/upload-artifact@v4
        with:
          name: charmera-card
          path: android/out/charmera-card.apk
      - name: Publish on Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat android/VERSION)
          gh release delete android-app --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create android-app android/out/charmera-card.apk --target "$GITHUB_SHA" \
            --title "Charmera Card for Android $VER (build ${{ github.run_number }})" \
            --notes "Puts a verified Charmera update file on an SD card from an Android phone (7.0 or later). Download charmera-card.apk on the phone, open it, and allow the install. What it does and what it cannot do: android/README.md."
          echo "APK: https://github.com/${{ github.repository }}/releases/download/android-app/charmera-card.apk" >> "$GITHUB_STEP_SUMMARY"
