name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Install dosfstools and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dosfstools ffmpeg
      # Without the public dump every test on real firmware is skipped, so it is fetched from upstream at a fixed
      # commit and must match its hash. The film-mods restore file is optional: its tests skip when it is gone.
      - name: Public firmware files for the tests (downloaded from upstream, never stored)
        shell: bash
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/stock.bin" \
            "https://raw.githubusercontent.com/benbadio/keychain-camera-plus/209c25a47ce91c805b663edb6e18861b367a5a1b/dumps/charmera_stock_latest.bin"
          echo "cc3b4b2fd7eb71ba5a441decdc86984261fac8418ee3e105d7e2b3c38b7ea42f  $RUNNER_TEMP/stock.bin" | sha256sum -c -
          echo "CHARMERA_STOCK_IMAGE=$RUNNER_TEMP/stock.bin" >> "$GITHUB_ENV"
          if curl -fsSL --retry 5 -o "$RUNNER_TEMP/film-restore.bin" \
               "https://github.com/Hyperlite-Media/charmera-film-mods/releases/download/Charmera_Restore/JH_5408202505201029_0852C329.bin" \
             && echo "5b352e46f1f52175cb4da2278be8db32ecc36be4943424d58cfd8e2cc9c4386f  $RUNNER_TEMP/film-restore.bin" | sha256sum -c -; then
            echo "CHARMERA_FILM_MODS_RESTORE=$RUNNER_TEMP/film-restore.bin" >> "$GITHUB_ENV"
          else
            echo "::warning::The film-mods restore file could not be fetched or did not match its hash; its tests are skipped."
          fi
      - name: Run the tests
        env:
          CHARMERA_REQUIRE_FSCK: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m charmera_toolkit --help
